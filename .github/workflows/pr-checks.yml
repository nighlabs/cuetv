name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./... -v

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # npm install instead of npm ci: the lockfile is generated on macOS ARM
      # and @emnapi optional native deps resolve differently on Linux x64.
      # npm install still respects the lockfile but tolerates platform variance.
      - run: npm install
      - run: npx vitest run
      - run: npm run build
